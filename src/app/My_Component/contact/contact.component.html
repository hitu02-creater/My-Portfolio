<section class="py-30 px-12 md:px-16 bg-[#060e20]/80 relative" id="contact">
    <div class="max-w-7xl mx-auto">
        <div class="grid lg:grid-cols-2 gap-20 items-start">
            <div>
                <h2 class="font-['Space Grotesk'] text-[40px] md:text-[45px] lg:text-[48px] mb-6">Let's build something
                    <span class="text-[#a4e6ff]">extraordinary</span>.</h2>
                <p class="font-['Inter'] text-[16px] md:text-[18px] lg:text-[20px] text-[#bbc9cf] mb-12">
                    Ready to take your digital presence to the next level? Get in touch today for a
                    consultation.
                </p>
                <div class="space-y-8">
                    <div class="flex items-start gap-6">
                        <div class="w-12 h-12 rounded-xl bg-[#171f33] flex items-center justify-center shrink-0">
                            <span class="social-icon material-symbols-outlined text-[#a4e6ff]">mail</span>
                        </div>
                        <div>
                            <p
                                class="font-['JetBrains Mono'] text-[14px] md:text-[16px] lg:text-[18px] text-[#bbc9cf] mb-1">
                                Email Me</p>
                            <p class="font-['Inter'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd]">
                                hiteshvekariya&#64;gmail.com</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-6">
                        <div class="w-12 h-12 rounded-xl bg-[#171f33] flex items-center justify-center shrink-0">
                            <span class="social-icon material-symbols-outlined text-[#a4e6ff]">location_on</span>
                        </div>
                        <div>
                            <p
                                class="font-['JetBrains Mono'] text-[14px] md:text-[16px] lg:text-[18px] text-[#bbc9cf] mb-1">
                                Location</p>
                            <p class="font-['Inter'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd]">Gujarat,
                                India</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-6">
                        <div class="w-12 h-12 rounded-xl bg-[#171f33] flex items-center justify-center shrink-0">
                            <span class="social-icon material-symbols-outlined text-[#a4e6ff]">phone</span>
                        </div>
                        <div>
                            <p
                                class="font-['JetBrains Mono'] text-[14px] md:text-[16px] lg:text-[18px] text-[#bbc9cf] mb-1">
                                Phone</p>
                            <p class="font-['Inter'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd]">+91 84014
                                66213</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="glass-card p-10 rounded-4xl">
                <form class="space-y-6" id="contactForm">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label
                                class="font-['JetBrains Mono'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd] block mb-2">Name</label>
                            <input
                                class="w-full bg-[#171f33] border border-[#3c494e]/30 rounded-xl px-4 py-3 focus:border-[#a4e6ff] focus:ring-1 focus:ring-[#a4e6ff] outline-none transition-all text-[#dae2fd]"
                                placeholder="John Doe" type="text" />
                        </div>
                        <div>
                            <label
                                class="font-['JetBrains Mono'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd] block mb-2">Email</label>
                            <input
                                class="w-full bg-[#171f33] border border-[#3c494e]/30 rounded-xl px-4 py-3 focus:border-[#a4e6ff] focus:ring-1 focus:ring-[#a4e6ff] outline-none transition-all text-[#dae2fd]"
                                placeholder="john@example.com" type="email" />
                        </div>
                    </div>
                    <div>
                        <label
                            class="font-['JetBrains Mono'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd] block mb-2">Subject</label>
                        <input
                            class="w-full bg-[#171f33] border border-[#3c494e]/30 rounded-xl px-4 py-3 focus:border-[#a4e6ff] focus:ring-1 focus:ring-[#a4e6ff] outline-none transition-all text-[#dae2fd]"
                            placeholder="Project Inquiry" type="text" />
                    </div>
                    <div>
                        <label
                            class="font-['JetBrains Mono'] text-[16px] md:text-[18px] lg:text-[20px] text-[#dae2fd] block mb-2">Message</label>
                        <textarea
                            class="w-full bg-[#171f33] border border-[#3c494e]/30 rounded-xl px-4 py-3 focus:border-[#a4e6ff] focus:ring-1 focus:ring-[#a4e6ff] outline-none transition-all text-[#dae2fd]"
                            placeholder="Tell me about your project..." rows="4"></textarea>
                    </div>
                    <button
                        class="w-full h-10 bg-[#a4e6ff] text-[#003543] font-['Space Grotesk'] text-[16px] md:text-[18px] lg:text-[20px] rounded-4xl shadow-[0_0_20px_rgba(0,209,255,0.3)] hover:scale-[0.98] transition-all"
                        type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>
