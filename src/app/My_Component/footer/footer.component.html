<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Footer Document</title>

</head>

<body>
    <footer class="relative bg-[#060e20] pt-24 pb-12 overflow-hidden text-center">
        <!-- Subtle Gradient Glow -->
        <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-px bg-linear-to-r from-transparent via-cyan-500/50 to-transparent">
        </div>

        <div class="max-w-7xl mx-auto px-6">
            <!-- Main Footer Content -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mb-16">

                <!-- Brand Column -->
                <div class="space-y-6">
                    <div class="text-[22px] md:text-[28px] lg:text-[34px] font-bold text-white tracking-tighter">
                        <span class="text-cyan-500">H.V </span> Developer
                    </div>
                    <p class="text-slate-400 leading-relaxed text-[14px] md:text-[18px] lg:text-[20px]">
                        Crafting high-performance web experiences with precision and modern technology stacks.
                    </p>
                    <div class="flex justify-center gap-4">
                        <a *ngFor="let social of socials" [href]="social.url"
                            class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center hover:border-cyan-500 hover:text-cyan-500 transition-all text-slate-300">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                <path [attr.d]="social.iconPath" />
                            </svg>
                        </a>
                    </div>
                </div>

                <!-- Quick Links -->
                <div>
                    <h4 class="text-white font-bold mb-6 uppercase tracking-widest text-[22px] md:text-[26px] lg:text-[32px]">Navigation</h4>
                    <ul class="space-y-4">
                        <li *ngFor="let link of quickLinks">
                            <a [href]="link.url"
                                class="text-slate-400 hover:text-cyan-400 transition-colors flex justify-center items-center group">
                                <span
                                    class="w-0 group-hover:w-4 h-px bg-cyan-500 mr-0 group-hover:mr-2 transition-all
                                    text-[20px] md:text-[24px] lg:text-[28px]"></span>
                                {{link.label}}
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- Contact Info -->
                <div>
                    <h4 class="text-white font-bold mb-6 uppercase tracking-widest text-[22px] md:text-[26px] lg:text-[32px]">Contact</h4>
                    <ul class="space-y-4 text-slate-400 text-[14px] md:text-[16px] lg:text-[20px]">
                        <li class="flex justify-center items-center gap-3 ">
                            <span class="text-cyan-500 text-[14px] md:text-[16px] lg:text-[20px]">Email: </span>
                            <a href="mailto:hello@devstudio.com" class="hover:text-white">hiteshvekariy012&#64;gmail.com</a>
                        </li>
                        <li class="flex justify-center items-center gap-3">
                            <span class="text-cyan-500 text-[14px] md:text-[16px] lg:text-[20px]">Location: </span>
                            <span>Gujarat, India</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Bottom Bar -->
            <div class="pt-8 border-t border-slate-800/50 flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-slate-500 text-[14px] md:text-[16px] lg:text-[20px] text-center">
                    © {{currentYear}} DevStudio. All rights reserved.
                </p>
                <div class="flex gap-8 text-[14px] md:text-[16px] lg:text-[20px] text-slate-500">
                    <a href="#" class="hover:text-cyan-500 transition">Privacy Policy</a>
                    <a href="#" class="hover:text-cyan-500 transition">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
