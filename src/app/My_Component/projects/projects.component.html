<section id="projects" class="py-20 bg-slate-50">
    <div class="max-w-7xl mx-auto px-6">

        <!-- Section Heading -->
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-900">
                My Projects
            </h2>
            <p class="mt-4 text-slate-600 max-w-2xl mx-auto">
                Projects showcasing my frontend development skills using Angular, React and modern web technologies.
            </p>
        </div>

        <!-- Projects Grid -->
        <div class="grid md:grid-cols-2 gap-8">

            <div *ngFor="let project of projects"
                class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300">

                <!-- Icon -->
                <div class="text-5xl mb-5">
                    {{ project.icon }}
                </div>

                <!-- Title -->
                <h3 class="text-2xl font-bold text-slate-900 mb-4">
                    {{ project.title }}
                </h3>

                <!-- Description -->
                <p class="text-slate-600 leading-relaxed mb-6">
                    {{ project.description }}
                </p>

                <!-- Tech Stack -->
                <div class="flex flex-wrap gap-2 mb-6">
                    <span *ngFor="let tech of project.technologies"
                        class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">
                        {{ tech }}
                    </span>
                </div>

                <!-- Button -->
                <a [href]="project.link" target="_blank"
                    class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700 transition duration-300">
                    View Project
                    <span>→</span>
                </a>
            </div>
        </div>
    </div>
</section>
