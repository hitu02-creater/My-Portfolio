<header class="navbar fixed top-0 w-full z-50 bg-[#0b1326]/80 backdrop-blur-md border-b border-slate-800">
  <nav [ngClass]="isScrolled ? 'bg-[#0b1326]/90 backdrop-blur-lg py-3 shadow-2xl' : 'bg-transparent py-5'"
    class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
    <div class="w-100">
      <img src="Logo (2).png" alt="H.V Developer" class="w-full h-auto items-center bg-transparent" />
    </div>
    <ul class="hidden md:flex gap-8 text-[12px] md:text-[14px] lg:text-[16px] 2xl:text-[16px] font-medium">
      <li><a href="#home" class="transition-all duration-300 hover:bg-white/10 hover:text-white hover:-translate-y-1 hover:shadow-lg hover:shadow-blue-500/20">
        HOME</a></li>
      <li><a href="#about" class="hover:text-cyan-400 hover:border-b-2 hover:border-cyan-400 transition">ABOUT</a></li>
      <li><a href="#education"
          class="hover:text-cyan-400 hover:border-b-2 hover:border-cyan-400 transition">EDUCATION</a></li>
      <li><a href="#skills" class="hover:text-cyan-400 hover:border-b-2 hover:border-cyan-400 transition">SKILLS</a>
      </li>
      <li><a href="#services" class="hover:text-cyan-400 hover:border-b-2 hover:border-cyan-400 transition">SERVICES</a>
      </li>
      <li><a href="#contact" class="hover:text-cyan-400 hover:border-b-2 hover:border-cyan-400 transition">CONTACT</a>
      </li>
    </ul>
    <button (click)="toggleOption()"
      class="md:hidden text-cyan-400 text-[35px] leading-none focus:outline-none transition-transform duration-300"
      [class.rotate-90]="isMenuOpen">
      {{ isMenuOpen ? '✕' : '☰' }}
    </button>
  </nav>
  <!-- Transitive Mobile Menu -->
  <div [ngClass]="isMenuOpen ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0'"
    class="absolute top-0 left-0 w-full bg-[#0d172d] -z-10 transition-all duration-500 ease-in-out md:hidden shadow-2xl">
    <ul class="flex flex-col items-center gap-6 py-24 text-[18px] font-semibold tracking-widest">
      <li><a href="#home" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">HOME</a></li>
      <li><a href="#about" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">ABOUT</a></li>
      <li><a href="#education" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">EDUCATION</a>
      </li>
      <li><a href="#skills" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">SKILLS</a></li>
      <li><a href="#services" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">SERVICES</a></li>
      <li><a href="#contact" (click)="closeMenu()" class="text-white hover:text-cyan-400 transition">CONTACT</a></li>
    </ul>
  </div>
</header>
